name: Deploy

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - apps/web/**
      - packages/core/**
      - bun.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Never run two prod deploys at once; queue the newer one instead of cancelling
# a deploy halfway through.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Write Google Cloud credentials
        run: printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/gcp.json"
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      - name: Deploy prod stage
        working-directory: apps/backend
        run: bun run deploy:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp.json
          WARDROBE_OWNER_EMAIL: ${{ secrets.WARDROBE_OWNER_EMAIL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
