name: Deploy

on:
  push:
    branches: [main]
    paths:
      - apps/backend/**
      - apps/web/**
      - packages/core/**
      - bun.lock
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Never run two prod deploys at once; queue the newer one instead of cancelling
# a deploy halfway through.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Deploy prod stage
        working-directory: apps/backend
        run: bun run deploy:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WARDROBE_OWNER_EMAIL: ${{ secrets.WARDROBE_OWNER_EMAIL }}
